<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VTickets" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Splash Screens y Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    
    <!-- Permissions Policy para cámara -->
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*" />
    
    <!-- Google Fonts - Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Lemon.js for Overlay Checkout - Cargar antes del contenido -->
    <script src="https://app.lemonsqueezy.com/js/lemon.js"></script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
